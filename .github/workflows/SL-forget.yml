name: SL forgetting dry run

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply eligible transitions instead of dry-run
        required: true
        type: boolean
        default: false
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: SL-forgetting
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Preview forgetting
        run: node dist/SL-src/SL-cli/SL-cli.js sweep . --dry-run
      - name: Apply forgetting
        if: ${{ github.event_name == 'schedule' || inputs.apply }}
        run: node dist/SL-src/SL-cli/SL-cli.js sweep .
      - name: Create retention pull request
        id: retention-pr
        if: ${{ github.event_name == 'schedule' || inputs.apply }}
        uses: peter-evans/create-pull-request@v7
        with:
          branch: SL-forget/automated-sweep
          delete-branch: true
          title: "SL: apply automatic forgetting policy"
          commit-message: "chore: apply SL forgetting policy"
          body: |
            Generated by the guarded SL retention workflow.

            Only registered SL-managed artifacts that passed ownership,
            pinning, dependency, and quarantine checks are included.
      - name: Enable guarded automatic merge
        if: ${{ steps.retention-pr.outputs.pull-request-number != '' }}
        run: gh pr merge "${{ steps.retention-pr.outputs.pull-request-number }}" --auto --squash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
