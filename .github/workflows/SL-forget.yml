name: SL forgetting dry run

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply eligible transitions instead of dry-run
        required: true
        type: boolean
        default: false
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: SL-forgetting
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout v4.4.0
        with:
          persist-credentials: false
      - name: Preview forgetting
        shell: pwsh
        run: pwsh .github/SL-learning/SL-runtime/SL.ps1 sweep . --dry-run
      - name: Apply forgetting
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply }}
        shell: pwsh
        run: |
          pwsh .github/SL-learning/SL-runtime/SL.ps1 sweep .
          pwsh .github/SL-learning/SL-runtime/SL.ps1 project .
      - name: Validate integrated projections
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply }}
        shell: pwsh
        run: pwsh .github/SL-learning/SL-runtime/SL.ps1 validate .
      - name: Capture retention patch
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply }}
        run: |
          git add -A
          git diff --cached --binary --full-index > "$RUNNER_TEMP/SL-forgetting.patch"
      - name: Upload retention patch
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact v4.6.2
        with:
          name: SL-forgetting-patch
          path: ${{ runner.temp }}/SL-forgetting.patch
          retention-days: 1

  propose:
    needs: plan
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout v4.4.0
        with:
          persist-credentials: false
      - name: Download retention patch
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # actions/download-artifact v4.3.0
        with:
          name: SL-forgetting-patch
          path: ${{ runner.temp }}/SL-patch
      - name: Apply reviewed retention patch
        id: apply-patch
        run: |
          if [ ! -s "$RUNNER_TEMP/SL-patch/SL-forgetting.patch" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git apply --check --binary "$RUNNER_TEMP/SL-patch/SL-forgetting.patch"
          git apply --index --binary "$RUNNER_TEMP/SL-patch/SL-forgetting.patch"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Create retention pull request
        id: retention-pr
        if: ${{ steps.apply-patch.outputs.changed == 'true' }}
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # peter-evans/create-pull-request v7.0.11
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: SL-forget/automated-sweep
          delete-branch: true
          title: "SL: apply automatic forgetting policy"
          commit-message: "chore: apply SL forgetting policy"
          body: |
            Generated by the guarded SL retention workflow.

            Only registered SL-managed artifacts that passed ownership,
            pinning, dependency, and quarantine checks are included.
