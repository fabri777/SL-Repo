parameters:
  - name: runtimeRepository
    type: string
    default: SLRuntime
  - name: vmImage
    type: string
    default: ubuntu-latest
  - name: consumerInstallCommand
    type: string
    default: ""
  - name: consumerCheckCommand
    type: string
    default: ""

jobs:
  - job: SLValidation
    displayName: SL repository validation
    pool:
      vmImage: ${{ parameters.vmImage }}
    steps:
      - checkout: self
        clean: true
        path: s
        persistCredentials: false
      - checkout: ${{ parameters.runtimeRepository }}
        clean: true
        fetchDepth: 1
        path: SL-tool
        persistCredentials: false
      - task: UseNode@1
        displayName: Use Node.js 20
        inputs:
          version: 20.x
      - pwsh: |
          $expected = "3c6bb31d1f717595791e9a575d698b5593cbcf10"
          $runtimeRoot = Join-Path "$(Pipeline.Workspace)" "SL-tool"
          $actual = (git -C $runtimeRoot rev-parse HEAD).Trim().ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "SL runtime must resolve to immutable commit $expected; found $actual."
          }
        displayName: Verify immutable SL runtime
      - pwsh: |
          $runtimeRoot = Join-Path "$(Pipeline.Workspace)" "SL-tool"
          npm ci --prefix $runtimeRoot
          if ($LASTEXITCODE -ne 0) { throw "SL runtime install failed." }
          npm run build --prefix $runtimeRoot
          if ($LASTEXITCODE -ne 0) { throw "SL runtime build failed." }
        displayName: Install and build SL runtime
      - ${{ if ne(parameters.consumerInstallCommand, '') }}:
          - pwsh: |
              Set-Location "$(Build.SourcesDirectory)"
              ${{ parameters.consumerInstallCommand }}
              if ($LASTEXITCODE -ne 0) { throw "Consumer install command failed." }
            displayName: Install consumer dependencies
      - ${{ if ne(parameters.consumerCheckCommand, '') }}:
          - pwsh: |
              Set-Location "$(Build.SourcesDirectory)"
              ${{ parameters.consumerCheckCommand }}
              if ($LASTEXITCODE -ne 0) { throw "Consumer check command failed." }
            displayName: Run consumer checks
      - pwsh: |
          $runtime = Join-Path "$(Pipeline.Workspace)" "SL-tool/dist/SL-src/SL-cli/SL-cli.js"
          node $runtime project "$(Build.SourcesDirectory)"
          if ($LASTEXITCODE -ne 0) { throw "SL project failed." }
          $drift = git -C "$(Build.SourcesDirectory)" status --porcelain=v1 --untracked-files=all -- .github/SL-learning
          if ($drift) {
            $drift | Write-Host
            throw "SL project drift detected. Run 'sl-repo project .' and commit the generated state."
          }
        displayName: Check SL projection and index drift
      - pwsh: |
          $runtime = Join-Path "$(Pipeline.Workspace)" "SL-tool/dist/SL-src/SL-cli/SL-cli.js"
          node $runtime validate "$(Build.SourcesDirectory)"
          if ($LASTEXITCODE -ne 0) { throw "SL validation failed." }
        displayName: Validate SL repository state
