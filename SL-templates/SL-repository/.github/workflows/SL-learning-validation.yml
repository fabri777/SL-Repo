name: SL learning validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
      - run: npm exec --yes --package=@fabri777/sl-repo@0.1.0 -- sl-repo validate .
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
