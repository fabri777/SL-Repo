name: SL learning validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check out SL Repo runtime
        uses: actions/checkout@v4
        with:
          repository: fabri777/SL-Repo
          ref: 00610f1e8b9c857be0623cda4a89352240ae12cd
          token: ${{ secrets.SL_REPO_TOKEN }}
          path: .SL-tool
          persist-credentials: false
      - name: Build SL Repo runtime
        run: |
          npm ci --prefix .SL-tool
          npm run build --prefix .SL-tool
      - name: Validate contracts, events, projections, and index
        run: node .SL-tool/dist/SL-src/SL-cli/SL-cli.js validate .
