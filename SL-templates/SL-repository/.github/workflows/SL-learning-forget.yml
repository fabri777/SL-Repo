name: SL learning forgetting

on:
  workflow_dispatch:
    inputs:
      apply:
        type: boolean
        required: true
        default: false
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: SL-forgetting
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node v4.4.0
        with:
          node-version: 20
      - name: Check out SL Repo runtime
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout v4.4.0
        with:
          repository: fabri777/SL-Repo
          ref: 31db40599b54df8b491d65d99a12ed6449a98ee6
          token: ${{ secrets.SL_REPO_TOKEN }}
          path: .SL-tool
          persist-credentials: false
      - name: Build SL Repo runtime
        run: |
          npm ci --prefix .SL-tool
          npm run build --prefix .SL-tool
      - name: Preview
        run: node .SL-tool/dist/SL-src/SL-cli/SL-cli.js sweep . --dry-run
      - name: Apply
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply }}
        run: |
          node .SL-tool/dist/SL-src/SL-cli/SL-cli.js sweep .
          node .SL-tool/dist/SL-src/SL-cli/SL-cli.js validate .
      - name: Remove SL Repo runtime checkout
        if: always()
        run: rm -rf .SL-tool
      - name: Capture retention patch
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply }}
        run: |
          git add -A
          git diff --cached --binary --full-index > "$RUNNER_TEMP/SL-forgetting.patch"
      - name: Upload retention patch
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact v4.6.2
        with:
          name: SL-forgetting-patch
          path: ${{ runner.temp }}/SL-forgetting.patch
          retention-days: 1

  propose:
    needs: plan
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout v4.4.0
        with:
          persist-credentials: false
      - name: Download retention patch
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # actions/download-artifact v4.3.0
        with:
          name: SL-forgetting-patch
          path: ${{ runner.temp }}/SL-patch
      - name: Apply reviewed retention patch
        id: apply-patch
        run: |
          if [ ! -s "$RUNNER_TEMP/SL-patch/SL-forgetting.patch" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git apply --check --binary "$RUNNER_TEMP/SL-patch/SL-forgetting.patch"
          git apply --index --binary "$RUNNER_TEMP/SL-patch/SL-forgetting.patch"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Create pull request
        id: retention-pr
        if: ${{ steps.apply-patch.outputs.changed == 'true' }}
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # peter-evans/create-pull-request v7.0.11
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: SL-forget/automated-sweep
          delete-branch: true
          title: "SL: apply automatic forgetting policy"
          commit-message: "chore: apply SL forgetting policy"
